<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>
    <title>Reservation API — Sign Up</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        max-width: 400px;
        margin: 4rem auto;
        padding: 0 1rem;
        color: #222;
      }
      h1 {
        font-size: 1.5rem;
        margin-bottom: 1.5rem;
      }
      form {
        display: flex;
        flex-direction: column;
        gap: 1rem;
      }
      label {
        font-size: 0.9rem;
        font-weight: 600;
      }
      input {
        padding: 0.5rem;
        font-size: 1rem;
        border: 1px solid #ccc;
        border-radius: 4px;
      }
      button {
        padding: 0.6rem;
        font-size: 1rem;
        background: #222;
        color: white;
        border: none;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover {
        background: #444;
      }
      #result {
        margin-top: 1rem;
        font-size: 0.9rem;
        white-space: pre-wrap;
      }
    </style>
  </head>
  <body>
    <h1>Create an account</h1>

    <form id="signup-form">
      <div>
        <label for="email">Email</label><br />
        <input type="email" id="email" required />
      </div>
      <div>
        <label for="password">Password</label><br />
        <input type="password" id="password" required />
      </div>

      <div class="cf-turnstile" data-sitekey="0x4AAAAAAEQJRpWxTOzf85NJ"></div>

      <button type="submit">Sign Up</button>
    </form>

    <div id="result"></div>

    <script>
      const form = document.getElementById("signup-form");
      const resultBox = document.getElementById("result");

      // Point this at the local server once it's running.
      const API_BASE_URL = "http://localhost:8080";

      form.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const captchaToken = document.querySelector(
          '[name="cf-turnstile-response"]',
        ).value;

        resultBox.textContent = "Sending...";

        try {
          const response = await fetch(`${API_BASE_URL}/api/v1/users`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email,
              password,
              captcha_token: captchaToken,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            resultBox.textContent = `Error: ${data.error || "Something went wrong"}`;
            return;
          }

          resultBox.textContent = `Success:\n${JSON.stringify(data, null, 2)}`;
        } catch (err) {
          resultBox.textContent = `Network error: ${err.message}`;
        }
      });
    </script>
  </body>
</html>
