<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script
      src="https://challenges.cloudflare.com/turnstile/v0/api.js"
      async
      defer
    ></script>
    <title>Household Reservations</title>
    <style>
      @import url("https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,700&family=Inter:wght@400;500;600&display=swap");

      :root {
        --night: #1b1f3b;
        --night-deep: #12152b;
        --card: #232852;
        --card-border: #343b6e;
        --amber: #e8a93b;
        --amber-soft: #f0c069;
        --rose: #d88c9a;
        --cream: #f5f1e8;
        --cream-dim: #b9bad6;
      }

      * {
        box-sizing: border-box;
      }

      body {
        font-family: "Inter", system-ui, sans-serif;
        background: radial-gradient(
          ellipse at top,
          var(--night) 0%,
          var(--night-deep) 70%
        );
        background-attachment: fixed;
        color: var(--cream);
        max-width: 440px;
        margin: 0 auto;
        min-height: 100vh;
        padding: 3rem 1.5rem;
        position: relative;
        overflow-x: hidden;
      }

      /* faint scattered stars, purely decorative */
      body::before {
        content: "";
        position: fixed;
        inset: 0;
        background-image:
          radial-gradient(
            1px 1px at 20% 15%,
            var(--cream-dim) 100%,
            transparent
          ),
          radial-gradient(
            1px 1px at 70% 8%,
            var(--cream-dim) 100%,
            transparent
          ),
          radial-gradient(
            1.5px 1.5px at 40% 30%,
            var(--cream-dim) 100%,
            transparent
          ),
          radial-gradient(
            1px 1px at 85% 40%,
            var(--cream-dim) 100%,
            transparent
          ),
          radial-gradient(
            1px 1px at 10% 55%,
            var(--cream-dim) 100%,
            transparent
          ),
          radial-gradient(
            1.5px 1.5px at 60% 70%,
            var(--cream-dim) 100%,
            transparent
          ),
          radial-gradient(
            1px 1px at 90% 85%,
            var(--cream-dim) 100%,
            transparent
          );
        opacity: 0.25;
        pointer-events: none;
        z-index: 0;
      }

      .view {
        position: relative;
        z-index: 1;
      }

      .hidden {
        display: none !important;
      }

      .eyebrow {
        font-family: "Inter", sans-serif;
        font-size: 0.75rem;
        font-weight: 600;
        letter-spacing: 0.12em;
        text-transform: uppercase;
        color: var(--amber-soft);
        margin-bottom: 0.5rem;
      }

      h1 {
        font-family: "Fraunces", serif;
        font-weight: 600;
        font-size: 2.4rem;
        line-height: 1.1;
        margin: 0 0 0.75rem;
        color: var(--cream);
      }

      .subtitle {
        color: var(--cream-dim);
        font-size: 0.95rem;
        line-height: 1.5;
        margin-bottom: 2.5rem;
      }

      /* --- Landing view --- */
      #landing-view {
        text-align: justify;
        padding-top: 2rem;
      }

      #landing-view h1 {
        text-align: justify;
      }

      .landing-actions {
        display: flex;
        flex-direction: column;
        gap: 0.85rem;
        margin-top: 2.5rem;
      }

      /* --- Card (ticket-stub styled) --- */
      .ticket-card {
        background: var(--card);
        border: 1px solid var(--card-border);
        border-radius: 14px;
        padding: 2rem 1.75rem;
        position: relative;
        box-shadow: 0 20px 50px -20px rgba(0, 0, 0, 0.6);
      }

      /* perforation notches, left and right edges */
      .ticket-card::before,
      .ticket-card::after {
        content: "";
        position: absolute;
        top: 50%;
        width: 22px;
        height: 22px;
        background: var(--night-deep);
        border-radius: 50%;
        transform: translateY(-50%);
      }
      .ticket-card::before {
        left: -12px;
      }
      .ticket-card::after {
        right: -12px;
      }

      form {
        display: flex;
        flex-direction: column;
        gap: 1.1rem;
      }

      label {
        font-size: 0.8rem;
        font-weight: 600;
        color: var(--cream-dim);
        letter-spacing: 0.02em;
      }

      input {
        width: 100%;
        margin-top: 0.4rem;
        padding: 0.65rem 0.75rem;
        font-size: 1rem;
        font-family: inherit;
        background: var(--night-deep);
        border: 1px solid var(--card-border);
        border-radius: 8px;
        color: var(--cream);
      }

      input:focus {
        outline: none;
        border-color: var(--amber);
        box-shadow: 0 0 0 3px rgba(232, 169, 59, 0.2);
      }

      input::placeholder {
        color: var(--cream-dim);
        opacity: 0.6;
      }

      button {
        padding: 0.75rem;
        font-size: 1rem;
        font-weight: 600;
        font-family: inherit;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        transition:
          transform 0.08s ease,
          opacity 0.15s ease;
      }

      button:active {
        transform: scale(0.98);
      }

      .btn-primary {
        background: var(--amber);
        color: var(--night-deep);
      }

      .btn-primary:hover {
        background: var(--amber-soft);
      }

      .btn-secondary {
        background: transparent;
        color: var(--cream);
        border: 1px solid var(--card-border);
      }

      .btn-secondary:hover {
        border-color: var(--amber-soft);
        color: var(--amber-soft);
      }

      .btn-link {
        background: none;
        border: none;
        color: var(--cream-dim);
        font-size: 0.85rem;
        text-decoration: underline;
        text-underline-offset: 3px;
        cursor: pointer;
        padding: 0;
        margin-top: 0.5rem;
        text-align: center;
      }

      .btn-link:hover {
        color: var(--amber-soft);
      }

      .back-arrow {
        background: none;
        border: none;
        color: var(--cream-dim);
        font-size: 0.85rem;
        cursor: pointer;
        padding: 0;
        margin-bottom: 1.5rem;
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
      }

      .back-arrow:hover {
        color: var(--amber-soft);
      }

      #result {
        margin-top: 1.5rem;
        font-size: 0.8rem;
        font-family: "Inter", monospace;
        color: var(--cream-dim);
        white-space: pre-wrap;
        word-break: break-word;
        max-height: 200px;
        overflow-y: auto;
      }

      .error-message {
        margin-top: 1rem;
        padding: 0.75rem 1rem;
        border-radius: 8px;
        font-size: 0.85rem;
        background: rgba(216, 140, 154, 0.12);
        border: 1px solid var(--rose);
        color: var(--rose);
      }

      .banner {
        display: flex;
        align-items: flex-start;
        gap: 0.65rem;
        padding: 0.9rem 1rem;
        border-radius: 10px;
        background: rgba(232, 169, 59, 0.12);
        border: 1px solid var(--amber);
        margin-bottom: 1.25rem;
      }

      .banner-icon {
        flex-shrink: 0;
        width: 20px;
        height: 20px;
        border-radius: 50%;
        background: var(--amber);
        color: var(--night-deep);
        font-size: 0.75rem;
        font-weight: 700;
        display: flex;
        align-items: center;
        justify-content: center;
        margin-top: 0.1rem;
      }

      .banner-text {
        font-size: 0.85rem;
        line-height: 1.4;
        color: var(--cream);
      }

      .cf-turnstile {
        display: flex;
        justify-content: center;
      }
    </style>
  </head>
  <body>
    <!-- ===== Landing view ===== -->
    <section id="landing-view" class="view">
      <div class="eyebrow">Household Reservations</div>
      <h1>Save the evening,<br />before it's booked.</h1>
      <p class="subtitle">
        One shared calendar for date nights, movie nights, and whatever else
        needs a claim before someone else takes the slot.
      </p>
      <div class="landing-actions">
        <button class="btn-primary" id="show-login-btn">Log In</button>
        <button class="btn-secondary" id="show-signup-btn">Sign Up</button>
      </div>
    </section>

    <!-- ===== Signup view ===== -->
    <section id="signup-view" class="view hidden">
      <button class="back-arrow" data-back>&larr; Back</button>
      <div class="eyebrow">New here</div>
      <h1>Create an account</h1>
      <div class="ticket-card">
        <form id="signup-form">
          <div>
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              placeholder="you@example.com"
              required
            />
          </div>
          <div>
            <label for="password">Password</label>
            <input
              type="password"
              id="password"
              placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
              required
            />
          </div>
          <div
            class="cf-turnstile"
            data-sitekey="0x4AAAAAAEQJRpWxTOzf85NJ"
          ></div>
          <button type="submit" class="btn-primary">Sign Up</button>
        </form>
      </div>
    </section>

    <!-- ===== Login view ===== -->
    <section id="login-view" class="view hidden">
      <button class="back-arrow" data-back>&larr; Back</button>
      <div class="eyebrow">Welcome back</div>
      <h1>Log in</h1>
      <div id="login-banner"></div>
      <div class="ticket-card">
        <form id="login-form">
          <div>
            <label for="login-email">Email</label>
            <input
              type="email"
              id="login-email"
              placeholder="you@example.com"
              required
            />
          </div>
          <div>
            <label for="login-password">Password</label>
            <input
              type="password"
              id="login-password"
              placeholder="&bull;&bull;&bull;&bull;&bull;&bull;&bull;&bull;"
              required
            />
          </div>
          <button type="submit" class="btn-primary">Log In</button>
        </form>
      </div>
    </section>

    <!-- ===== Dashboard view ===== -->
    <section id="dashboard-view" class="view hidden">
      <div class="eyebrow">Welcome back</div>
      <h1>Your Reservations</h1>
      <button class="btn-primary" id="new-reservation-btn">
        + New Reservation
      </button>
      <div id="reservations-list"></div>
    </section>

    <div id="result"></div>

    <script>
      const views = {
        landing: document.getElementById("landing-view"),
        signup: document.getElementById("signup-view"),
        login: document.getElementById("login-view"),
        dashboard: document.getElementById("dashboard-view"),
      };

      function showView(name, bannerMessage) {
        Object.values(views).forEach((v) => v.classList.add("hidden"));
        views[name].classList.remove("hidden");
        document.getElementById("result").textContent = "";

        const banner = document.getElementById("login-banner");
        if (bannerMessage) {
          banner.innerHTML = `
            <div class="banner">
              <span class="banner-icon">&#10003;</span>
              <span class="banner-text">${bannerMessage}</span>
            </div>`;
        } else {
          banner.innerHTML = "";
        }
      }

      document
        .getElementById("show-login-btn")
        .addEventListener("click", () => showView("login"));
      document
        .getElementById("show-signup-btn")
        .addEventListener("click", () => showView("signup"));
      document.querySelectorAll("[data-back]").forEach((btn) => {
        btn.addEventListener("click", () => showView("landing"));
      });

      const signupForm = document.getElementById("signup-form");
      const loginForm = document.getElementById("login-form");
      const resultBox = document.getElementById("result");

      // Point this at the local server once it's running.
      const API_BASE_URL = "http://localhost:8080";

      signupForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("email").value;
        const password = document.getElementById("password").value;
        const captchaToken = document.querySelector(
          '[name="cf-turnstile-response"]',
        ).value;

        resultBox.textContent = "Sending...";

        try {
          const response = await fetch(`${API_BASE_URL}/api/v1/users`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email,
              password,
              captcha_token: captchaToken,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            resultBox.textContent = `Error: ${data.error || "Something went wrong"}`;
            return;
          }

          showView("login", "Account created. Log in below to get started.");
        } catch (err) {
          resultBox.textContent = `Network error: ${err.message}`;
        }
      });

      loginForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-password").value;

        resultBox.textContent = "Sending...";

        try {
          const response = await fetch(`${API_BASE_URL}/api/v1/login`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              email,
              password,
            }),
          });

          const data = await response.json();

          if (!response.ok) {
            resultBox.textContent = `Error: ${data.error || "Something went wrong"}`;
            return;
          }

          localStorage.setItem("access_token", data.token);
          localStorage.setItem("refresh_token", data.refresh_token);
          showView("dashboard");
          loadReservations();
        } catch (err) {
          resultBox.textContent = `Network error: ${err.message}`;
        }
      });

      async function loadReservations() {
        const token = localStorage.getItem("access_token");
        try {
          const response = await fetch(`${API_BASE_URL}/api/v1/reservations`, {
            method: "GET",
            headers: {
              Authorization: `Bearer ${token}`,
            },
          });

          const data = await response.json();

          if (!response.ok) {
            resultBox.textContent = `Error: ${data.error || "Something went wrong"}`;
            return;
          }

          resultBox.textContent = JSON.stringify(data, null, 2);
        } catch (err) {
          resultBox.textContent = `Network error: ${err.message}`;
        }
      }
    </script>
  </body>
</html>
